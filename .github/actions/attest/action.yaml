name: Sign & Attest image with Cosign
description: Sign & Attest image release with SBOM

inputs: 
  image: 
    description: URL to the Image 
    required: true 
  

runs:
  using: composite

  steps:      
    - name: Install Cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 
    - name: Sign Image (Cosign)
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
      run: |
        set -eu
        cosign sign --yes "${IMAGE}"

    - name: SBOM Attestation (Cosign)
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
      run: |
        set -eu
        cosign attest --yes \
          --predicate sbom.spdx.json \
          --type spdxjson \
          "${IMAGE}"